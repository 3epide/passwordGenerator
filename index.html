<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>password Maker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="generator-wrapper">
        <h1>password Maker</h1>

        <form>
            <input type="text" id="result">
            <button type="button" class="btn-copy">
                <i class="fa fa-copy"></i>
            </button>
        </form>
        <div class="selection-section">
            <div class="selection">
                <label>password length</label>
                <input type="number" id="characterLength" min="6" max="20" value="20">
            </div>

            <div class="selection">
                <label>Include lowercase characters</label>
                <input type="checkbox" id="lowercaseCharacter" name="lowercaseCharacter" checked>
            </div>

            <div class="selection">
                <label>Include uppercase characters</label>
                <input type="checkbox" id="uppercaseCharacter" name="uppercaseCharacter" checked>
            </div>

            <div class="selection">
                <label>Include number characters</label>
                <input type="checkbox" id="numberCharacter" name="numberCharacter" checked>
            </div>

            <div class="selection">
                <label>Include symbol characters</label>
                <input type="checkbox" id="symbolCharacter" name="symbolCharacter" checked>
            </div>

        </div>
        <button type="button" class="btn-generate">generate</button>

    </div>



    <script src="app.js"></script>
</body>

</html>
